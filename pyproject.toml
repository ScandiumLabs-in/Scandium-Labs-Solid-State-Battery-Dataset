[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssb-dataset"
version = "0.1.0"
description = "Scandium Labs — Solid-State Battery Materials Dataset Pipeline"
readme = "README.md"
license = {text = "CC-BY-4.0"}
requires-python = ">=3.10"
dependencies = [
    "pymatgen>=2024.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "tenacity>=8.2",
    "tqdm>=4.65",
    "huggingface_hub>=0.23",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1",
    "pre-commit>=3.5",
]
dft = [
    "custodian>=2024.0",
    "ase>=3.22",
]
literature = [
    "grobid-client>=0.1",
    "openai>=1.0",
    "semanticscholar>=0.5",
]
ml = [
    "torch>=2.1",
    "torch-geometric>=2.4",
    "matminer>=0.9",
    "pymatgen-analysis-diffusion>=2024",
]
sources = [
    "oqmd>=1.0",
    "jarvis-tools>=2024.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ssb_dataset*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
