<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SSB Review Dashboard{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { padding-bottom: 4rem; }
  .decision-auto_approve { color: #1a7f37; font-weight: 600; }
  .decision-auto_reject { color: #b00020; font-weight: 600; }
  .decision-human { color: #9a6700; font-weight: 600; }
  .status-approved { color: #1a7f37; font-weight: 600; }
  .status-rejected { color: #b00020; font-weight: 600; }
  .status-pending { color: #9a6700; font-weight: 600; }
  .rule-PASS { color: #1a7f37; }
  .rule-WARNING { color: #9a6700; }
  .rule-FAIL { color: #b00020; }
  .factor-bar { height: 6px; background: #e9ecef; border-radius: 3px; overflow: hidden; }
  .factor-fill { height: 100%; background: #0d6efd; }
  .value-display { font-size: 1.4rem; font-weight: 700; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
  .evidence-box { background: #fffbe6; border-left: 4px solid #f0c000; padding: .6rem .8rem; font-size: .92rem; }
  .btn-edit { --bs-btn-color: #000; }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">SSB Review Dashboard</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Queue</a>
    </div>
  </div>
</nav>
<div class="container-fluid px-4">
{% block content %}{% endblock %}
</div>
</body>
</html>
